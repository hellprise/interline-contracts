openapi: 3.1.0
info:
  title: Interline engine API
  version: 1.0.0
  description: Seat availability of flights, served by interline-engine.
  license:
    name: MIT
    identifier: MIT

paths:
  /v1/flights/{flightKey}/availability:
    get:
      operationId: getFlightAvailability
      summary: Free seats of a flight per cabin
      parameters:
        - $ref: "#/components/parameters/FlightKey"
      responses:
        "200":
          description: Free seats per cabin, cabins sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightAvailability"
              example:
                flightKey: V8-220-2026-11-02
                cabins:
                  - cabin: business
                    available: 20
                  - cabin: economy
                    available: 2
                  - cabin: first
                    available: 0
        "400":
          description: flightKey does not match AIRLINE-NUMBER-YYYY-MM-DD.
        "404":
          description: No such flight.
        5XX:
          description: The engine failed, for example the database is down.

components:
  parameters:
    FlightKey:
      name: flightKey
      in: path
      required: true
      description: AIRLINE-NUMBER-YYYY-MM-DD, where the date is the UTC departure date.
      schema:
        type: string
        pattern: "^[A-Z0-9]{2}-[1-9][0-9]{0,3}-[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
        example: V8-220-2026-11-02

  schemas:
    FlightAvailability:
      type: object
      required: [flightKey, cabins]
      properties:
        flightKey:
          type: string
          example: V8-220-2026-11-02
        cabins:
          type: array
          items:
            $ref: "#/components/schemas/CabinAvailability"

    CabinAvailability:
      type: object
      required: [cabin, available]
      properties:
        cabin:
          type: string
          example: economy
        available:
          type: integer
          minimum: 0
          example: 2
